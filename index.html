<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Cricket Stream Player</title>
    <!-- Shaka Player compiled library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        .video-container {
            width: 90%;
            max-width: 900px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Live Stream (Educational Purpose)</h1>
    <div class="video-container">
        <video id="video" controls autoplay></video>
    </div>

    <script>
        // Hotstar link wrapped with CORS proxy to bypass browser restriction
        const rawUrl = 'https://absiakjacbzuaaayilhangsonvj6f.live-cf.cdn.hotstar.com/hls/live/2027118/inallow-indvswi-2026/hin/1540080167/15mindvrm01a7a6ed57d87f4366810fe10dfd032fb311october2026/master_apmf_360_1.m3u8';
        const manifestUri = 'https://corsproxy.io/?' + encodeURIComponent(rawUrl);

        async function initApp() {
            shaka.polyfill.installAll();

            if (shaka.Player.isBrowserSupported()) {
                const video = document.getElementById('video');
                const player = new shaka.Player(video);

                player.addEventListener('error', onErrorEvent);

                try {
                    await player.load(manifestUri);
                    console.log('The video has now been loaded successfully!');
                } catch (e) {
                    onError(e);
                }
            } else {
                console.error('Browser not supported!');
            }
        }

        function onErrorEvent(event) {
            onError(event.detail);
        }

        function onError(error) {
            console.error('Error code', error.code, 'object', error);
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>

</body>
</html>
