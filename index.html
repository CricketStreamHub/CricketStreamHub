
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CricketStreamHub</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  background: #111a2e;
  padding: 20px;
  text-align: center;
  border-bottom: 2px solid #16c784;
}

header h1 {
  margin: 0;
  color: #16c784;
  font-size: 26px;
}

header p {
  color: #b8c2d1;
  margin-bottom: 0;
}

.container {
  max-width: 900px;
  margin: 30px auto;
  padding: 15px;
}

.match {
  background: #111a2e;
  padding: 20px;
  border-radius: 14px;
  border: 1px solid #26334b;
}

.match h2 {
  text-align: center;
  margin-top: 0;
}

.player {
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 10px;
  overflow: hidden;
}

.player video,
.player iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

.telegram-btn {
  display: block;
  width: 100%;
  margin-top: 18px;
  padding: 15px;
  background: #229ed9;
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.telegram-btn:hover {
  background: #168ac2;
}

/* TELEGRAM POPUP */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.8);
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.modal-box {
  background: #172238;
  border: 1px solid #34425b;
  border-radius: 15px;
  padding: 28px 22px;
  width: 100%;
  max-width: 360px;
  text-align: center;
}

.modal-box h2 {
  margin-top: 0;
  color: #16c784;
}

.modal-box p {
  color: #c0cada;
}

.join-btn {
  display: block;
  background: #229ed9;
  color: white;
  padding: 13px;
  border-radius: 8px;
  text-decoration: none;
  font-weight: bold;
  margin: 20px 0 12px;
}

.close-btn {
  background: #303b50;
  color: white;
  border: none;
  padding: 11px 22px;
  border-radius: 7px;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 20px;
  color: #8d9bb0;
  font-size: 13px;
}

</style>
</head>

<body>

<header>
  <h1>🏏 CricketStreamHub</h1>
  <p>Cricket • Live Updates • Match Centre</p>
</header>

<main class="container">

  <section class="match">

  <h2>India vs Australia</h2>

  <div class="player">
    <iframe
      src="https://www.hotstar.com/in/sports/cricket/india-vs-west-indies-1st-odi/1540080152/video/live/watch"
      title="Cricket Match"
      width="100%"
      height="450"
      style="border: none;"
      allowfullscreen>
    </iframe>
  </div>

</section>

</main>

<!-- TELEGRAM POPUP -->
<div class="modal" id="telegramModal"
     onclick="closeOutside(event)">

  <div class="modal-box">

    <h2>🏏 CricketStreamHub</h2>

    <p>
      Join our Telegram channel for cricket
      news and match updates!
    </p>

    <a class="join-btn"
       href="https://t.me/+AmbPBuvfoc05MzE1"
       target="_blank"
       rel="noopener noreferrer">
      ✈ Join Telegram
    </a>

    <button class="close-btn" onclick="closeTelegram()">
      Close
    </button>

  </div>
</div>

<footer>
  © 2026 CricketStreamHub
</footer>

<script>
function openTelegram() {
  document.getElementById("telegramModal")
    .style.display = "flex";
}

function closeTelegram() {
  document.getElementById("telegramModal")
    .style.display = "none";
}

function closeOutside(event) {
  if (event.target.id === "telegramModal") {
    closeTelegram();
  }
}

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape") {
    closeTelegram();
  }
});
</script>

</body>
</html>
