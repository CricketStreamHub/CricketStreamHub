<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream Test Player (Educational)</title>
    <!-- Shaka Player CDN (DRM aur MPD files chalane ke liye) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        body { background-color: #121212; color: white; font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        video { width: 80%; max-width: 800px; border-radius: 8px; margin-top: 20px; background: black; }
    </style>
</head>
<body>

    <h2>Local Stream Test Player</h2>
    <p>Yeh sirf learning aur testing ke liye hai.</p>

    <!-- Video Element -->
    <video id="videoPlayer" controls autoplay></video>

    <script>
        async function initApp() {
            // Shaka Player ko load karna
            shaka.polyfill.installData();
            if (!shaka.Player.isBrowserSupported()) {
                console.error('Browser not supported!');
                return;
            }

            const video = document.getElementById('videoPlayer');
            const player = new shaka.Player(video);

            // Error handling
            player.addEventListener('error', (event) => {
                console.error('Error code', event.detail);
            });

            // Public test stream link
            const manifestUri = 'https://dash.akamaized.net/akamai/bbb_30fps/bbb_30fps.mpd';

            try {
                await player.load(manifestUri);
                console.log('Video loaded successfully!');
            } catch (e) {
                console.error('Error loading video', e);
            }
        }

        document.addEventListener('DOMContentLoaded', initApp);
    </script>

</body>
</html>
